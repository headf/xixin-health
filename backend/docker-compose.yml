services:
  mysql:
    image: mysql:8.4
    container_name: xixin-health-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: xixin_health
      MYSQL_USER: xixin
      MYSQL_PASSWORD: xixin123456
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.2
    container_name: xixin-health-redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
