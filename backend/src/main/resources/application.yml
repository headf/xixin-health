server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: xixin-health-backend
  datasource:
    url: jdbc:mysql://localhost:3306/xixin_health?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull
    username: root
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 30
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 16
  transaction:
    default-timeout: 30

xixin:
  data-seeder:
    enabled: true
  security:
    token-secret: ${JWT_SECRET:your-jwt-secret-change-me-to-a-strong-secret-with-at-least-32-bytes}
    access-token-seconds: 7200
    refresh-token-seconds: 2592000

logging:
  level:
    root: WARN
    com.xixin.health: INFO
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}  %-5level %5p %5L [%16.16t] %-40.40logger{39} : %msg%n"
