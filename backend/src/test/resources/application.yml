spring:
  datasource:
    url: "jdbc:h2:mem:xixin_test_${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1"
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  sql:
    init:
      mode: always

xixin:
  security:
    token-secret: "test-only-change-me-to-a-strong-secret-with-at-least-32-bytes"
    access-token-seconds: 7200
    refresh-token-seconds: 604800
  data-seeder:
    enabled: false
